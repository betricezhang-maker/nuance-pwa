<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuance V8</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0;color:#172033}
header{padding:20px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:8px;padding:0 20px 20px}
button{border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
.tab{background:white;border:1px solid #ddd}
.active{background:#635bff;color:white}
main{padding:0 20px}
.card{background:white;border-radius:20px;padding:20px;margin-bottom:20px;border:1px solid #ddd}
.hidden{display:none}
textarea{width:100%;height:120px;border-radius:12px;padding:12px}
.list-item{padding:12px;border-bottom:1px solid #eee}
.pagination{display:flex;justify-content:center;gap:20px;margin-top:20px}
</style>
</head>
<body>
<header>
<h1>Nuance <small>V8</small></h1>
<span>Read → Understand → Compare → Retain</span>
</header>

<nav>
<button class="tab active" onclick="show('lookup',this)">Lookup</button>
<button class="tab" onclick="show('review',this)">Review</button>
<button class="tab" onclick="show('library',this)">Library</button>
<button class="tab" onclick="show('config',this)">Config</button>
</nav>

<main>
<section id="lookup" class="card">
<h2>Lookup</h2>
<textarea placeholder="Paste word, phrase, or sentence"></textarea>
<br><br>
<button class="active">Analyze with AI</button>
<div class="card">
<h3>AI Result</h3>
<p>Synonyms, intensity, context and examples appear here.</p>
</div>
</section>

<section id="review" class="card hidden">
<h2>Daily Review</h2>
<h3 id="queue">238 cards waiting</h3>
<button class="active" onclick="startReview()">Start Review</button>
<div id="reviewCard" class="card hidden">
<h2>take a spill</h2>
<p>Meaning: to fall; to tip over</p>
<button>Again</button>
<button>Hard</button>
<button>Good</button>
<button>Easy</button>
</div>
</section>

<section id="library" class="card hidden">
<h2>Vocabulary Library</h2>
<input placeholder="Search vocabulary..." style="width:100%;padding:12px">
<div id="list"></div>
<div class="pagination">
<button>Prev</button>
<span>Page 1 / 12</span>
<button>Next</button>
</div>
</section>

<section id="config" class="card hidden">
<h2>Config</h2>
<p>Cloud sync</p>
<p>Import / Export</p>
<p>Data management</p>
</section>
</main>

<script>
function show(id,btn){
document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
}
function startReview(){
document.getElementById('reviewCard').classList.remove('hidden');
document.getElementById('queue').innerText='Review 1 / 238';
}
let words=['flurry','take a spill',"tip one's hat",'break the ice','on the fence'];
document.getElementById('list').innerHTML=words.map(w=>'<div class="list-item">'+w+'</div>').join('');
</script>
</body>
</html>
