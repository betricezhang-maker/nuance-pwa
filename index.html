<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuance V8.4 Clean Architecture</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0;padding:20px;color:#172033}
header{margin-bottom:15px}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px 15px;border-radius:12px;border:1px solid #ddd;background:white;cursor:pointer}
.active{background:#4f46e5;color:white}
.page{display:none}
.page.active{display:block}
.card{background:white;border-radius:18px;padding:18px;margin-top:15px}
textarea,input{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;box-sizing:border-box}
.history{background:#f1f2f4;color:#666;padding:10px;border-radius:12px;margin-top:8px}
.item{padding:10px;border-bottom:1px solid #eee}
.pagination{display:flex;justify-content:center;gap:12px;margin-top:15px}
</style>
</head>

<body>
<header>
<h1>Nuance V8.4</h1>
<p>Read → Understand → Remember</p>
</header>

<nav>
<button onclick="openPage('lookup',this)" class="active">Lookup</button>
<button onclick="openPage('review',this)">Review</button>
<button onclick="openPage('library',this)">Library</button>
<button onclick="openPage('config',this)">Config</button>
</nav>

<section id="lookup" class="page active card">
<h2>Lookup</h2>
<textarea id="query" placeholder="Paste word, phrase or paragraph"></textarea>
<div id="history" class="history" style="display:none"></div>
<br>
<button onclick="analyze()">Analyze with AI</button>
<div id="result" class="card">AI result appears here.</div>
</section>

<section id="review" class="page card">
<h2>Review</h2>
<p id="reviewStatus">No scheduled cards yet. Random practice available.</p>
<button onclick="startReview()">Start Review</button>
<div id="reviewCard" class="card" style="display:none"></div>
</section>

<section id="library" class="page card">
<h2>Library</h2>
<input placeholder="Search vocabulary">
<div id="libraryList"></div>
<div class="pagination">
<button onclick="prevPage()">Prev</button>
<span id="pageInfo"></span>
<button onclick="nextPage()">Next</button>
</div>
</section>

<section id="config" class="page card">
<h2>Config</h2>
<button onclick="alert('Sync ready')">Cloud Sync</button>
<button onclick="alert('Import ready')">Import</button>
<button onclick="alert('Export ready')">Export</button>
<button onclick="alert('Data management ready')">Data Management</button>
</section>

<script>
let words=JSON.parse(localStorage.getItem("nuance_words")||"[]");
let page=1, size=20, reviewIndex=0;

function openPage(id,btn){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
 if(id==="library")renderLibrary();
}

document.getElementById("query").addEventListener("focus",()=>{
 let h=document.getElementById("history");
 h.style.display="none";
});

document.getElementById("query").addEventListener("input",()=>{
 document.getElementById("history").style.display="none";
});

function analyze(){
 let q=document.getElementById("query").value.trim();
 if(!q)return;
 words.unshift({phrase:q,date:new Date().toISOString(),nextReview:Date.now()});
 localStorage.setItem("nuance_words",JSON.stringify(words));
 document.getElementById("result").innerHTML=
 "<h3>"+q+"</h3><p>Meaning / synonyms / intensity / context will be displayed here.</p>";
 renderLibrary();
}

function startReview(){
 if(words.length===0){
  document.getElementById("reviewCard").innerHTML="No phrases saved yet.";
 }else{
  let w=words[reviewIndex%words.length];
  document.getElementById("reviewCard").innerHTML=
  "<h3>"+w.phrase+"</h3>"+
  "<button onclick='rate(\"Again\")'>Again</button>"+
  "<button onclick='rate(\"Hard\")'>Hard</button>"+
  "<button onclick='rate(\"Good\")'>Good</button>"+
  "<button onclick='rate(\"Easy\")'>Easy</button>";
 }
 document.getElementById("reviewCard").style.display="block";
}
function rate(x){
 reviewIndex++;
 startReview();
}
function renderLibrary(){
 let list=document.getElementById("libraryList");
 let start=(page-1)*size;
 list.innerHTML=words.slice(start,start+size).map(x=>
 "<div class='item'>"+x.phrase+"</div>").join("");
 document.getElementById("pageInfo").innerText=
 "Page "+page+" / "+Math.max(1,Math.ceil(words.length/size));
}
function nextPage(){if(page<Math.ceil(words.length/size))page++;renderLibrary()}
function prevPage(){if(page>1)page--;renderLibrary()}
renderLibrary();
</script>
</body>
</html>
